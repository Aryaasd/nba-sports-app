name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # newer than the local dev venv (3.9); matches Streamlit Cloud
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -v
